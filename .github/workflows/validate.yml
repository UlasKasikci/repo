name: Web Edition Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  web-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none

      - name: Shell syntax (bash -n)
        run: |
          for f in scripts/web/*.sh; do
            bash -n "$f"
            echo "OK: $f"
          done

      - name: JSON lint (config matrisi + state kontratı + contracts)
        run: |
          for f in opencode.json .factory/*.json .factory/contracts/*.json .cursor/mcp*.json*; do
            [ -f "$f" ] || continue
            python3 -m json.tool "$f" > /dev/null
            echo "OK: $f"
          done

      - name: YAML lint (antigravity.yaml)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; yaml.safe_load(open('antigravity.yaml', encoding='utf-8')); print('OK: antigravity.yaml')"

      - name: Static analysis & test tools (garantici teslimat, §8)
        run: |
          composer global require phpstan/phpstan phpunit/phpunit --no-interaction --no-progress
          echo "$(composer global config bin-dir --absolute 2>/dev/null | tail -1)" >> "$GITHUB_PATH"
          npm install -g eslint@8
          python3 -m pip install --quiet jsonschema
          echo "tools ready"

      - name: CJK encoding check (Tur 2-8 C — AI edit sızıntısı kalıcı koruma)
        run: bash scripts/web/cjk-check.sh .

      - name: State Graph + QA + Packaging self-test
        run: bash scripts/web/self-test.sh
