engine: "Multi-Agent-State-Graph"
context: "Web-Only-Production"
version: "1.3.2"
system_architect: "Ulaş Kaşıkcı"
canonical_spec: "docs/WEB-EDITION.md"
factory_repository: "https://github.com/UlasKasikci/repo"
workspace_role: ".factory/workspace-role.json"
customer_start: "docs/CUSTOMER-START.md"
skills_root: ".opencode/skills"
skills_prefer:
  - error-doctor
  - zero-hallucination
  - hierarchical-audit
  - auth-rbac
  - admin-crud
  - kvkk-compliance
  - seo-basics
directives:
  - "Web-only: never Android/Flutter/Gradle/YAPILACAKLAR. PHP MVC + MySQL + HTML/CSS/JS only."
  - "Read RUN-STATUS.md, PHASE-LOG.md, and .factory/web-state.json before any generation."
  - "On IDE switch follow docs/IDE-HANDOFF.md; append phase-log.sh at session end."
  - "Before write-code/package/claim-pass/git-push/doctor: bash scripts/web/guard.sh <op> . — DENY means stop and follow fix."
  - "Never git push unless the user explicitly asks; default is DENY via guard.sh git-push."
  - "If workspace-role is customer-app or WEBRAIL-CUSTOMER.md exists: never set origin to UlasKasikci/repo; never push to the factory."
  - "On QA FAIL: bash scripts/web/doctor.sh . --loop then fix only FIX-BRIEF.md leftovers — never dump full qa-report into the model."
  - "After brief: bash scripts/web/plan-from-brief.sh . \"<brief>\" → PLAN.md (not Android YAPILACAKLAR)."
  - "Run bash scripts/web/denetle.sh . at P1/P3/P5; orchestrate auto-hooks do this if you forget /denetle."
  - "gap-scan WARN/BLOCKER (cart, payment, reviews, rbac, seo, kvkk) → update PLAN before packaging."
  - "Run bash scripts/web/decide.sh after P1 (open-source decision layer; no paid JEV)."
  - "Scan missing dependencies and missing business features automatically."
  - "Run local linter and PHP syntax checks before build step."
  - "Execute packaging pipeline: Output folder -> ./Yukleme/ with subfolder ./Yukleme/SQL/veritabani.sql"
  - "Prevent node_modules or vendor dev-dependencies from leaking into ./Yukleme/"
  - "Never emit mobile code (Flutter/Compose/React Native/Gradle); PHP 8.1+ MVC + MySQL only."
  - "QA gate must return 0 Error, 0 Warning before packaging is allowed."
  - "Halt after max_retries: 3 QA failures (4th failure) and emit debug_report.json."
  - "Prefer .factory/modules catalog skills before free-form LLM generation."
  - "Never claim PASS without bash scripts/web/guard.sh claim-pass ."
pipeline:
  phases:
    - id: P1
      name: "Domain & Scope Validation"
      agent: web-domain-architect
    - id: P2
      name: "Code Generation Engine"
      agent: web-core-engineer
    - id: P3
      name: "QA & Automated Test Pool"
      agent: web-qa-gatekeeper
      command: "bash scripts/web/qa-gate.sh <project>"
      auto_hooks: ["doctor.sh (on FAIL)", "denetle.sh (on PASS)"]
    - id: P4
      name: "Revision Loop"
      agent: web-core-engineer
    - id: P5
      name: "Packaging & Deployment Gate"
      agent: web-deploy-packager
      command: "bash scripts/web/package-yukleme.sh <project>"
      auto_hooks: ["denetle.sh (pre-package)"]
  state: "bash scripts/web/state.sh status|start|advance|qa-pass|qa-fail|halt"
  max_retries: 3
  self_test: "bash scripts/web/self-test.sh"
  auto_hooks: ".factory/auto-hooks.json"
  denetle: "bash scripts/web/denetle.sh <project>"
  plan_from_brief: "bash scripts/web/plan-from-brief.sh <project> \"<brief>\""
outputs:
  deploy_dir: "./Yukleme"
  sql_dump: "./Yukleme/SQL/veritabani.sql"
  reports:
    - "qa-report.json"
    - "debug_report.json"
    - "packaging-report.json"
    - "gap-report.json"
    - "DENETIM.md"
    - "PLAN.md"
